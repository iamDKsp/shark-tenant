version: '3.8'

services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    container_name: sol-financeiro-whatsapp
    restart: unless-stopped
    ports:
      - "3529:3529"
    volumes:
      - whatsapp_auth_data:/app/auth_info_baileys
    environment:
      - NODE_ENV=production

volumes:
  whatsapp_auth_data:
    name: sol_financeiro_whatsapp_auth
